{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - SIGUET</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/siguet.css' %}" rel="stylesheet">
</head>
<body class="fondo-login">

  <div class="tarjeta-login">
    <div class="d-flex align-items-center gap-3 mb-4">
      <i class="bi bi-clock-history" style="font-size: 3rem; color: var(--azul-oscuro);"></i>
      <div class="login-titulo">SIGUET - Gestión Inteligente<br>de Horarios Académicos</div>
    </div>

    {% for mensaje in messages %}
      <div class="alert alert-danger py-2 small">{{ mensaje }}</div>
    {% endfor %}

    <form method="post">
      {% csrf_token %}
      <div class="input-group mb-3">
        <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
        <input type="text" name="usuario" class="form-control" placeholder="Nombre de usuario" required autofocus>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
        <input type="password" name="contrasena" id="contrasena" class="form-control border-end-0" placeholder="Contraseña" required>
        <button type="button" class="input-group-text bg-white" onclick="verContrasena()" title="Mostrar u ocultar">
          <i class="bi bi-eye-slash" id="icono-ojo"></i>
        </button>
      </div>
      <button type="submit" class="btn btn-login w-100 py-2">Iniciar Sesión</button>
    </form>

    <div class="d-flex align-items-center gap-2 mt-4 small text-secondary">
      <i class="bi bi-shield-lock fs-4" style="color: var(--azul-oscuro);"></i>
      Acceso mediante credenciales cifradas y control de roles (RBAC)
    </div>
  </div>

  <script>
    function verContrasena() {
      const campo = document.getElementById('contrasena');
      const icono = document.getElementById('icono-ojo');
      const oculta = campo.type === 'password';
      campo.type = oculta ? 'text' : 'password';
      icono.className = oculta ? 'bi bi-eye' : 'bi bi-eye-slash';
    }
  </script>

</body>
</html>
