{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}SIGUET{% endblock %} - SIGUET</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/siguet.css' %}" rel="stylesheet">
</head>
<body class="estilo-horario">

  <!-- ===== Barra horizontal oscura (mockup vista semanal) ===== -->
  <header class="barra-horario">
    <a href="/" class="marca-horario">
      <i class="bi bi-hurricane"></i>
      <span class="nombre">SIGUET</span>
      <span class="lema">Gestión Inteligente de<br>Horarios Académicos</span>
    </a>

    <div class="usuario-horario">
      <div class="avatar-claro"><i class="bi bi-person-fill"></i></div>
      <span>{{ request.session.nombre }} -<br>Administrador</span>
    </div>

    <nav class="nav-horario">
      <a href="/">Inicio</a>
      <a href="/consultas/horario/" class="activo">Horarios</a>
      <a href="/consultas/reportes/">Reportes</a>
      <a href="{% url 'ajustes' %}">Configuración</a>
      <a href="{% url 'logout' %}" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></a>
    </nav>
  </header>

  <main class="area-horario">
    {% block contenido %}{% endblock %}
  </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
