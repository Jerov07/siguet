{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}SIGUET{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/siguet.css' %}" rel="stylesheet">
</head>
<body >

  <nav class="navbar navbar-dark barra-superior px-3">
    <span class="navbar-brand fw-bold"><i class="bi bi-gear-wide-connected"></i> SIGUET</span>
  </nav>

  <div class="d-flex">
    <aside class="menu-lateral p-3">
            <nav class="nav flex-column">
        <a class="nav-link {% if request.path == '/' %}activo{% endif %}" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-link {% if '/restricciones/' in request.path %}activo{% endif %}" href="/restricciones/"><i class="bi bi-sliders"></i> Restricciones</a>
        <a class="nav-link {% if '/catalogo/asignaturas/' in request.path %}activo{% endif %}" href="/catalogo/asignaturas/"><i class="bi bi-book"></i> Materias</a>
        <a class="nav-link {% if '/catalogo/docentes/' in request.path %}activo{% endif %}" href="/catalogo/docentes/"><i class="bi bi-person"></i> Docentes</a>
        <a class="nav-link {% if '/catalogo/grupos/' in request.path %}activo{% endif %}" href="/catalogo/grupos/"><i class="bi bi-people"></i> Grupos</a>
        <a class="nav-link {% if '/catalogo/aulas/' in request.path %}activo{% endif %}" href="/catalogo/aulas/"><i class="bi bi-building"></i> Aulas</a>
        <a class="nav-link {% if '/catalogo/franjas/' in request.path %}activo{% endif %}" href="/catalogo/franjas/"><i class="bi bi-clock"></i> Franjas</a>
        <a class="nav-link {% if '/catalogo/clases/' in request.path %}activo{% endif %}" href="/catalogo/clases/"><i class="bi bi-easel"></i> Clases</a>
        <a class="nav-link {% if '/generacion/' in request.path %}activo{% endif %}" href="/generacion/"><i class="bi bi-calendar-plus"></i> Generar horario</a>
        <a class="nav-link {% if '/consultas/horario/' in request.path %}activo{% endif %}" href="/consultas/horario/"><i class="bi bi-search"></i> Consultas</a>
        <a class="nav-link {% if '/consultas/reportes/' in request.path %}activo{% endif %}" href="/consultas/reportes/"><i class="bi bi-graph-up"></i> Reportes</a>
      </nav>
    </aside>

    <main class="flex-grow-1 p-4">
      {% block contenido %}{% endblock %}
    </main>
  </div>

</body>
</html>
